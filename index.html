<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualisasi Kesetimbangan Momen – Timbangan Realistis</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(#eef2ff, #ffffff);
      margin: 0;
      padding: 20px;
    }
    h1 { text-align: center; }
    .container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      max-width: 1100px;
      margin: auto;
    }
    .card {
      background: white;
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 6px 15px rgba(0,0,0,0.12);
    }
    canvas {
      background: linear-gradient(#e0f2fe, #f8fafc);
      border-radius: 12px;
      border: 1px solid #ddd;
    }
    label { font-weight: bold; }
    input[type=range] { width: 100%; }
    .rumus {
      background: #f1f5f9;
      padding: 12px;
      border-radius: 10px;
      font-family: monospace;
      margin-top: 10px;
    }
    .status-setimbang { color: green; font-weight: bold; }
    .status-tidak { color: red; font-weight: bold; }
  </style>
</head>
<body>

<h1>Visualisasi Kesetimbangan Momen (Fisika Terapan)</h1>

<div class="container">
  <div class="card">
    <h2>Pengaturan Beban</h2>

    <label>Berat Kiri (W₁) = <span id="w1Val">10</span> N</label>
    <input type="range" min="1" max="50" value="10" id="w1">

    <br><br>

    <label>Jarak Kiri (d₁) = <span id="d1Val">2</span> m</label>
    <input type="range" min="1" max="5" value="2" id="d1">

    <br><br>

    <label>Berat Kanan (W₂) = <span id="w2Val">10</span> N</label>
    <input type="range" min="1" max="50" value="10" id="w2">

    <br><br>

    <label>Jarak Kanan (d₂) = <span id="d2Val">2</span> m</label>
    <input type="range" min="1" max="5" value="2" id="d2">

    <h3>Rumus Kesetimbangan</h3>
    <div class="rumus">
      Στ = 0<br>
      W₁ × d₁ = W₂ × d₂
    </div>

    <p id="hasil"></p>
  </div>

  <div class="card">
    <h2>Visualisasi Timbangan & Moda Transportasi</h2>
    <canvas id="kanvas" width="500" height="280"></canvas>
  </div>
</div>

<script>
const canvas = document.getElementById("kanvas");
const ctx = canvas.getContext("2d");

const w1 = document.getElementById("w1");
const d1 = document.getElementById("d1");
const w2 = document.getElementById("w2");
const d2 = document.getElementById("d2");

const w1Val = document.getElementById("w1Val");
const d1Val = document.getElementById("d1Val");
const w2Val = document.getElementById("w2Val");
const d2Val = document.getElementById("d2Val");
const hasil = document.getElementById("hasil");

function jenisKendaraan(w) {
  if (w <= 10) return "🚲";
  if (w <= 20) return "🏍️";
  if (w <= 30) return "🚗";
  if (w <= 40) return "🚌";
  return "🚛";
}

function gambarKendaraan(x, y, w) {
  ctx.font = "32px Arial";
  ctx.textAlign = "center";
  ctx.fillText(jenisKendaraan(w), x, y);
}

function gambar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = 120;

  const m1 = w1.value * d1.value;
  const m2 = w2.value * d2.value;
  const sudut = Math.max(Math.min((m2 - m1) * 0.4, 12), -12);

  /* ===== ALAS TIMBANGAN ===== */
  ctx.fillStyle = "#64748b";
  ctx.fillRect(cx - 60, cy + 70, 120, 10);

  /* ===== TIANG ===== */
  ctx.fillRect(cx - 5, cy + 10, 10, 60);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(sudut * Math.PI / 180);

  /* ===== BATANG TIMBANGAN ===== */
  ctx.beginPath();
  ctx.moveTo(-200, 0);
  ctx.lineTo(200, 0);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#1f2933";
  ctx.stroke();

  const skala = 35;
  const piringY = 22;

  /* ===== Piring kiri ===== */
  ctx.fillStyle = "#cbd5e1";
  ctx.fillRect(-d1.value * skala - 30, piringY, 60, 8);

  /* ===== Piring kanan ===== */
  ctx.fillRect(d2.value * skala - 30, piringY, 60, 8);

  /* ===== Kendaraan ===== */
  gambarKendaraan(-d1.value * skala, piringY - 5, w1.value);
  gambarKendaraan(d2.value * skala, piringY - 5, w2.value);

  ctx.restore();

  hasil.innerHTML =
    m1 === m2
      ? `<span class="status-setimbang">Status: SETIMBANG ✅</span><br>W₁×d₁ = ${m1} Nm | W₂×d₂ = ${m2} Nm`
      : `<span class="status-tidak">Status: TIDAK SETIMBANG ❌</span><br>W₁×d₁ = ${m1} Nm | W₂×d₂ = ${m2} Nm`;
}

function update() {
  w1Val.textContent = w1.value;
  d1Val.textContent = d1.value;
  w2Val.textContent = w2.value;
  d2Val.textContent = d2.value;
  gambar();
}

[w1, d1, w2, d2].forEach(e => e.addEventListener("input", update));
update();
</script>

</body>
</html>
