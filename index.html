<script>
const canvas = document.getElementById("kanvas");
const ctx = canvas.getContext("2d");

const w1 = document.getElementById("w1");
const d1 = document.getElementById("d1");
const w2 = document.getElementById("w2");
const d2 = document.getElementById("d2");

const w1Val = document.getElementById("w1Val");
const d1Val = document.getElementById("d1Val");
const w2Val = document.getElementById("w2Val");
const d2Val = document.getElementById("d2Val");
const hasil = document.getElementById("hasil");

function jenisKendaraan(w) {
  if (w <= 10) return "🚲";
  if (w <= 20) return "🏍️";
  if (w <= 30) return "🚗";
  if (w <= 40) return "🚌";
  return "🚛";
}

function gambarKendaraan(x, y, w) {
  ctx.font = "30px Arial";
  ctx.textAlign = "center";
  ctx.fillText(jenisKendaraan(w), x, y);
}

function gambar() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const cx = canvas.width / 2;
  const cy = 115;

  const m1 = w1.value * d1.value;
  const m2 = w2.value * d2.value;
  const sudut = Math.max(Math.min((m2 - m1) * 0.4, 12), -12);

  /* ===== ALAS ===== */
  ctx.fillStyle = "#475569";
  ctx.fillRect(cx - 70, cy + 90, 140, 12);

  /* ===== TIANG ===== */
  ctx.fillRect(cx - 6, cy + 20, 12, 70);

  /* ===== TITIK TUMPU ===== */
  ctx.beginPath();
  ctx.arc(cx, cy + 20, 6, 0, Math.PI * 2);
  ctx.fillStyle = "#1f2933";
  ctx.fill();

  ctx.save();
  ctx.translate(cx, cy + 20);
  ctx.rotate(sudut * Math.PI / 180);

  /* ===== BATANG TIMBANGAN ===== */
  ctx.beginPath();
  ctx.moveTo(-200, 0);
  ctx.lineTo(200, 0);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#0f172a";
  ctx.stroke();

  const skala = 35;
  const taliPanjang = 35;
  const piringY = taliPanjang + 8;

  /* ===== TALI KIRI ===== */
  ctx.beginPath();
  ctx.moveTo(-d1.value * skala, 0);
  ctx.lineTo(-d1.value * skala, taliPanjang);
  ctx.strokeStyle = "#334155";
  ctx.lineWidth = 2;
  ctx.stroke();

  /* ===== TALI KANAN ===== */
  ctx.beginPath();
  ctx.moveTo(d2.value * skala, 0);
  ctx.lineTo(d2.value * skala, taliPanjang);
  ctx.stroke();

  /* ===== PIRING KIRI ===== */
  ctx.fillStyle = "#cbd5e1";
  ctx.fillRect(-d1.value * skala - 28, piringY, 56, 8);

  /* ===== PIRING KANAN ===== */
  ctx.fillRect(d2.value * skala - 28, piringY, 56, 8);

  /* ===== KENDARAAN ===== */
  gambarKendaraan(-d1.value * skala, piringY - 5, w1.value);
  gambarKendaraan(d2.value * skala, piringY - 5, w2.value);

  ctx.restore();

  hasil.innerHTML =
    m1 === m2
      ? `<span class="status-setimbang">Status: SETIMBANG ✅</span><br>
         W₁×d₁ = ${m1} Nm | W₂×d₂ = ${m2} Nm`
      : `<span class="status-tidak">Status: TIDAK SETIMBANG ❌</span><br>
         W₁×d₁ = ${m1} Nm | W₂×d₂ = ${m2} Nm`;
}

function update() {
  w1Val.textContent = w1.value;
  d1Val.textContent = d1.value;
  w2Val.textContent = w2.value;
  d2Val.textContent = d2.value;
  gambar();
}

[w1, d1, w2, d2].forEach(e => e.addEventListener("input", update));
update();
</script>
